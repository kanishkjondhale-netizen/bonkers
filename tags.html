<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BONKERS — test hangtags</title>
<style>
:root{--volt:#D8FF3E}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Helvetica Neue",Arial,sans-serif;background:#F2F2F2;color:#000;padding:24px}
h1{font-size:20px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
p.lead{font-size:13px;color:#555;margin:8px 0 22px;max-width:640px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;max-width:1000px}
.tag{background:#fff;border:2px solid #000;padding:14px;border-radius:2px}
.tag .nm{font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.tag .sub{font-size:11px;color:#666;margin-top:2px}
.tag .pr{font-size:16px;font-weight:800;margin-top:6px}
.tag svg{display:block;width:100%;height:auto;margin-top:10px}
.tag .code{font-size:11px;letter-spacing:.14em;text-align:center;margin-top:4px;font-variant-numeric:tabular-nums}
.tag .brand{display:inline-block;background:var(--volt);font-size:9px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;padding:3px 6px;margin-bottom:8px}
@media print{body{background:#fff;padding:0}p.lead,h1{display:none}.grid{gap:8px}}
</style>
</head>
<body>
<h1>BONKERS test hangtags</h1>
<p class="lead">Real EAN-13 barcodes for the six catalogue items. Open this page on a laptop or second phone (or print it) and scan the codes with the app's camera. Keep the screen bright and hold the phone 10–20&nbsp;cm away.</p>
<div class="grid" id="grid"></div>

<script>
(function(){
"use strict";
var ITEMS=[
 {ean:"8902000000016", nm:"Bonk Tee",    pr:1100, sub:"Oversized · heavy cotton"},
 {ean:"8902000000023", nm:"Volt Hoodie", pr:2900, sub:"Acid · 400 gsm fleece"},
 {ean:"8902000000030", nm:"Cargo 01",    pr:2400, sub:"Black · ripstop"},
 {ean:"8902000000047", nm:"NOQ Cap",     pr:800,  sub:"Black · embroidered"},
 {ean:"8902000000054", nm:"Stack Socks", pr:500,  sub:"3 pack · ribbed"},
 {ean:"8902000000061", nm:"Drip Jacket", pr:4900, sub:"Shell · water resistant"}
];

var L=["0001101","0011001","0010011","0111101","0100011","0110001","0101111","0111011","0110111","0001011"];
var G=["0100111","0110011","0011011","0100001","0011101","0111001","0000101","0010001","0001001","0010111"];
var R=L.map(function(s){return s.split("").map(function(c){return c==="0"?"1":"0";}).join("");});
var PARITY=["LLLLLL","LLGLGG","LLGGLG","LLGGGL","LGLLGG","LGGLLG","LGGGLL","LGLGLG","LGLGGL","LGGLGL"];

function checkDigit(d12){
  var sum=0;
  for(var i=0;i<12;i++) sum += (+d12[i]) * (i%2===0?1:3);
  return (10-(sum%10))%10;
}
function modules(ean){
  var d=ean.split("").map(Number);
  var pat=PARITY[d[0]], out="101", i;
  for(i=1;i<=6;i++) out += (pat[i-1]==="L"?L:G)[d[i]];
  out += "01010";
  for(i=7;i<=12;i++) out += R[d[i]];
  return out+"101";
}
/* 95 modules + 9 quiet each side = 113 units wide; guard bars run longer */
function svg(ean){
  var m=modules(ean), unit=2, quiet=9, w=(95+quiet*2)*unit, h=80, tall=h-10, shrt=h-22;
  var longAt=function(i){ return (i<3) || (i>=45&&i<50) || (i>=92); };
  var bars="",x=quiet*unit,i;
  for(i=0;i<m.length;i++){
    if(m[i]==="1") bars+='<rect x="'+x+'" y="0" width="'+unit+'" height="'+(longAt(i)?tall:shrt)+'"/>';
    x+=unit;
  }
  var txt='<text x="'+(quiet*unit/2)+'" y="'+(h-2)+'" font-size="11" font-family="monospace" text-anchor="middle">'+ean[0]+'</text>';
  txt+='<text x="'+((quiet+3+21)*unit)+'" y="'+(h-2)+'" font-size="11" font-family="monospace" text-anchor="middle">'+ean.slice(1,7)+'</text>';
  txt+='<text x="'+((quiet+50+21)*unit)+'" y="'+(h-2)+'" font-size="11" font-family="monospace" text-anchor="middle">'+ean.slice(7)+'</text>';
  return '<svg viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg"><rect width="'+w+'" height="'+h+'" fill="#fff"/><g fill="#000">'+bars+'</g>'+txt+'</svg>';
}

var grid=document.getElementById("grid");
ITEMS.forEach(function(it){
  var ok = checkDigit(it.ean.slice(0,12)) === +it.ean[12];
  var d=document.createElement("div"); d.className="tag";
  d.innerHTML='<span class="brand">Bonkers</span>'+
    '<div class="nm"></div><div class="sub"></div>'+
    '<div class="pr"></div>'+svg(it.ean)+
    '<div class="code"></div>';
  d.querySelector(".nm").textContent=it.nm;
  d.querySelector(".sub").textContent=it.sub;
  d.querySelector(".pr").textContent="₹"+it.pr.toLocaleString("en-IN");
  d.querySelector(".code").textContent=it.ean+(ok?"":" ✕ bad check digit");
  grid.appendChild(d);
});
})();
</script>
</body>
</html>
